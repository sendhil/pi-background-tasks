name: Release certification

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to certify (must equal package version as vX.Y.Z)'
        required: true

permissions:
  contents: read

jobs:
  certify:
    name: Certify tagged package payload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Pin candidate revision
        shell: bash
        run: echo "CANDIDATE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify committed generated artifacts first
        shell: bash
        run: npm run verify:generated -- --candidate "${{ env.CANDIDATE }}" --node-version 22.19.0 --npm-version 11.19.0

      - name: Verify fork contract
        run: npm run verify:fork

      - name: Check tag matches package version
        run: npm run release:check-version
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}

      - name: Provision exact current host outside project dependencies
        run: npm install --prefix "$RUNNER_TEMP/pi-host" --no-audit --no-fund @earendil-works/pi-coding-agent@1.1.0

      - name: Qualify committed Git installation (default and process)
        run: npm run test:compat -- --host "$RUNNER_TEMP/pi-host/node_modules/@earendil-works/pi-coding-agent" --candidate "${{ env.CANDIDATE }}"

      - name: Docs freshness
        run: npm run docs:verify

      - name: Payload closure
        run: npm run payload:check

      - name: Set up pnpm 11.18.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Pnpm packed-install supply-chain regression
        run: npm run test:pnpm-pack

      - name: Certification note
        run: echo "Release certification complete; this workflow never publishes."

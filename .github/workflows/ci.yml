name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no job here needs write access.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Never hide a platform-specific failure behind a faster one.
      fail-fast: false
      matrix:
        # This personal fork qualifies macOS and Linux; Windows is out of scope.
        os: [ubuntu-latest, macos-latest]
        node: ['22.19.0', '24.22.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` requires the committed lockfile and installs exactly it.
      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Pin candidate revision
        shell: bash
        run: echo "CANDIDATE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify committed generated artifacts first
        shell: bash
        run: >-
          npm run verify:generated -- --candidate "${{ env.CANDIDATE }}"
          --node-version ${{ matrix.node }} --npm-version 11.19.0

      - name: Verify fork contract
        run: npm run verify:fork

      - name: Typecheck
        run: npm run typecheck

      - name: Docs freshness gate
        run: npm run docs:verify

      - name: Type-safety standard
        run: npm run test:type-safety

      # Preserve shell behavior on both supported platforms.
      - name: POSIX invariance
        run: npx tsx --test tests/unit/posix-invariance.test.ts

      # The default gate: unit, SDK, RPC, component, and package suites.
      - name: Default test gate
        run: npm test
        env:
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
          CI: '1'

      - name: Scripted-provider agent loop
        run: npm run test:agent-loop
        env:
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
          CI: '1'

      - name: Pack contents
        run: npm run pack:dry-run

      - name: Set up pnpm 11.18.0 for exotic-subdependency regression
        if: runner.os == 'Linux' && matrix.node == '22.19.0'
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Pnpm packed-install supply-chain regression
        if: runner.os == 'Linux' && matrix.node == '22.19.0'
        run: npm run test:pnpm-pack

  current-host:
    name: Pi 1.1.0 Git install · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.22.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Pin candidate revision
        shell: bash
        run: echo "CANDIDATE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify committed generated artifacts first
        run: >-
          npm run verify:generated -- --candidate "${{ env.CANDIDATE }}"
          --node-version ${{ matrix.node }} --npm-version 11.19.0
      - name: Verify fork contract
        run: npm run verify:fork
      - name: Provision exact current host outside project dependencies
        run: >-
          npm install --prefix "$RUNNER_TEMP/pi-host" --no-audit --no-fund
          @earendil-works/pi-coding-agent@1.1.0
      - name: Qualify committed Git installation (default and process)
        run: >-
          npm run test:compat --
          --host
          "$RUNNER_TEMP/pi-host/node_modules/@earendil-works/pi-coding-agent"
          --candidate "${{ env.CANDIDATE }}"
